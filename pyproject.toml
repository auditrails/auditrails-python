[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "auditrails"
version = "1.0.0"
description = "Official Python SDK for auditrails.io — tamper-proof audit logging as a service"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [
    { name = "AuditRails", email = "support@auditrails.io" },
]
keywords = ["audit", "audit-log", "audit-trail", "compliance", "soc2", "hipaa", "gdpr", "logging"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]

[project.optional-dependencies]
async = ["httpx>=0.24.0"]

[project.urls]
Homepage = "https://auditrails.io"
Repository = "https://github.com/auditrails/auditrails-python"
Documentation = "https://docs.auditrails.io"

[tool.hatch.build.targets.wheel]
packages = ["src/auditrails"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.9"
strict = true
warn_return_any = true
warn_unused_configs = true
